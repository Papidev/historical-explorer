name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_base:
        description: Main commit used to prepare the dependency release
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether application checks are needed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run_checks=true
          if [ "$EVENT_NAME" != "workflow_dispatch" ] &&
            [ -n "$CHANGE_BASE" ] &&
            [ "$CHANGE_BASE" != "0000000000000000000000000000000000000000" ] &&
            git diff --quiet --no-renames "$CHANGE_BASE" HEAD -- . ':!docs/' ':!README.md' ':!AGENTS.md'; then
            run_checks=false
          fi
          echo "run_checks=$run_checks" >> "$GITHUB_OUTPUT"
          if [ "$run_checks" = "false" ]; then
            echo "Documentation only: skipping application checks."
          fi

      - name: Set up pnpm
        if: steps.changes.outputs.run_checks == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Set up Node.js
        if: steps.changes.outputs.run_checks == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.run_checks == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check application version
        if: steps.changes.outputs.run_checks == 'true'
        env:
          RELEASE_BASE: ${{ inputs.release_base || github.event.pull_request.base.sha || github.event.before }}
        run: pnpm release:check "$RELEASE_BASE"

      - name: Lint
        if: steps.changes.outputs.run_checks == 'true'
        run: pnpm lint

      - name: Test
        if: steps.changes.outputs.run_checks == 'true'
        run: pnpm test

      - name: Test dependency release automation
        if: steps.changes.outputs.run_checks == 'true'
        run: node --test scripts/test-dependabot-release.mjs

      - name: Build
        if: steps.changes.outputs.run_checks == 'true'
        run: pnpm build

      - name: Check built app starts
        if: steps.changes.outputs.run_checks == 'true'
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3000/ > /dev/null; then
              node scripts/check-production.mjs
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          cat /tmp/next-start.log
          exit 1

  release-tag:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Tag the release version
        env:
          RELEASE_BASE: ${{ github.event.before }}
        run: |
          current_version=$(node -p 'require("./package.json").version')
          previous_version=$(git show "$RELEASE_BASE:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
          if [ "$current_version" = "$previous_version" ] &&
            [ -n "$(git ls-tree --name-only "$RELEASE_BASE" -- CHANGELOG.md .changeset/config.json)" ]; then
            exit 0
          fi
          release_tag="v$current_version"
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            test "$(git rev-parse "$release_tag^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$release_tag" "$GITHUB_SHA"
            git push origin "refs/tags/$release_tag"
          fi
