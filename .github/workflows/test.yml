name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check application version
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm release:check "$RELEASE_BASE"

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check built app starts
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3000/ > /dev/null; then
              node scripts/check-production.mjs
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          cat /tmp/next-start.log
          exit 1

  release-tag:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Tag the release version
        env:
          RELEASE_BASE: ${{ github.event.before }}
        run: |
          current_version=$(node -p 'require("./package.json").version')
          previous_version=$(git show "$RELEASE_BASE:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
          if [ "$current_version" = "$previous_version" ] &&
            [ -n "$(git ls-tree --name-only "$RELEASE_BASE" -- CHANGELOG.md .changeset/config.json)" ]; then
            exit 0
          fi
          release_tag="v$current_version"
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            test "$(git rev-parse "$release_tag^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$release_tag" "$GITHUB_SHA"
            git push origin "refs/tags/$release_tag"
          fi
